services:
  - type: web
    name: ai-learning-partner-360
    rootDir: .
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-learning-partner-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        value: llama3.2:1b

databases:
  - name: ai-learning-partner-db
    databaseName: ai_learning_partner
    user: ai_learning_partner
    plan: basic-256mb
